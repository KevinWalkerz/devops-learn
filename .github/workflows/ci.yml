name: Go CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests
        run: go test ./...
      
      - name: Build Docker Image
        run: docker build -t devops-lab:${{ github.sha }} .